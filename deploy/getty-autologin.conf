# Cyrberus boot-to-standby: log the kiosk account in on the physical console.
#
# Installed by `deploy/boot-mode.sh on` as
#     /etc/systemd/system/getty@tty1.service.d/autologin.conf
# and removed by `deploy/boot-mode.sh off`. raspi-config uses the same file
# name for its own console autologin, so the two never end up fighting.
#
# The kiosk account has no password and no sudo. Its ~/.bash_profile starts
# the operator screen on tty1 and never offers a shell there.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin kiosk --noclear %I $TERM
