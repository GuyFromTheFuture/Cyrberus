# Installed as /etc/tmpfiles.d/cyrberus.conf
#
# /run is a tmpfs and is emptied on every boot. The systemd unit's
# RuntimeDirectory= recreates /run/cyrberus when the service starts, but a
# daemon started by hand cannot create it - /run is root-owned. This rule
# makes systemd-tmpfiles create it at boot regardless.
#
#   sudo cp deploy/tmpfiles.d-cyrberus.conf /etc/tmpfiles.d/cyrberus.conf
#   sudo systemd-tmpfiles --create
#
# Type Path            Mode UID       GID       Age Argument
d      /run/cyrberus   0750 cyrberus  cyrberus  -   -
d      /var/log/cyrberus 0750 cyrberus cyrberus -   -
