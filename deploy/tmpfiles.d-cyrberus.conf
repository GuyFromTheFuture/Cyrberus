# Installed as /etc/tmpfiles.d/cyrberus.conf by deploy/install-head.sh.
#
# /run is a tmpfs and is emptied on every boot. The service's RuntimeDirectory=
# recreates /run/cyrberus when it starts, but a daemon started by hand cannot
# create it - /run is root-owned. This makes systemd-tmpfiles create it at
# boot regardless, before anything else runs.
#
# Group cyrberus has read access: the kiosk account and the admin account are
# members, so the screen can read state.json. Only the daemon can write.
#
# Manual install:
#   sudo cp deploy/tmpfiles.d-cyrberus.conf /etc/tmpfiles.d/cyrberus.conf
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/cyrberus.conf
#
# Type Path                Mode UID       GID       Age Argument
d      /run/cyrberus       0750 cyrberus  cyrberus  -   -
d      /var/log/cyrberus   0750 cyrberus  cyrberus  -   -
d      /mnt/cyrberus-scan  0750 cyrberus  cyrberus  -   -
