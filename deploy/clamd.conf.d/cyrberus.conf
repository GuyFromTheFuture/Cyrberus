# Settings appended to /etc/clamav/clamd.conf by the setup guide.
#
# AlertExceedsMax is the important one: by default ClamAV silently SKIPS
# files above its size limits, so a large enough payload would pass
# validation uninspected. Flagging instead of skipping makes the Head
# fail closed.
AlertExceedsMax yes

MaxFileSize 1000M
MaxScanSize 2000M
MaxFiles 50000
MaxRecursion 32

ScanArchive yes
ScanPE yes
ScanOLE2 yes
ScanPDF yes
ScanHTML yes

# Encrypted content cannot be inspected, so it is not evidence of safety.
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
